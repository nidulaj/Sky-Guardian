[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skyguardian-backend"
version = "0.1.0"
description = "SkyGuardian AI FastAPI Backend & Orchestrator"
authors = [{ name = "Team Novax" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.1",
    "pgvector>=0.2.5",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "htbuilder>=0.6.2",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "tzdata>=2024.1",
    "langgraph>=0.0.30",
    "google-generativeai>=0.4.1",
    "tavily-python>=0.3.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "black",
    "isort",
    "mypy"
]
